---
driver:
  name: docker
platforms:
  - name: base-instance
    image: geerlingguy/docker-ubuntu2604-ansible
    command: /lib/systemd/systemd
    cgroupns_mode: host
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
verifier:
  name: ansible
scenario:
  # Collections are installed by make setup/CI; there are no custom dependency,
  # prepare, side-effect or cleanup playbooks for this scenario.
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
