---
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: lint and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync && uv run ansible-galaxy collection install -r requirements.yml

      - name: Run lint and daemon-free configuration checks
        run: make check

  molecule:
    name: base role integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install dependencies
        run: uv sync && uv run ansible-galaxy collection install -r requirements.yml

      - name: Run molecule
        run: make test
